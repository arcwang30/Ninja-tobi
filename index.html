<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d2a2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NINJA 鳶 TOBI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-64.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-title" content="忍者鳶">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sideBg" aria-hidden="true"></canvas>   <!-- iPad／電腦橫向：兩側的月下城夜景（sidebg.js） -->
<div id="sideHud" aria-hidden="true"><div class="sh-box"><div id="shStats"></div><div class="pause-sk" id="shSk"></div></div></div>   <!-- iPad／電腦橫向：左側資訊欄 -->
<button id="shScroll" class="sh-scroll"><span class="sh-roll"></span><b data-i18n="soar_btn"></b><i>×0</i></button>   <!-- 右側豪天翔大按鈕 -->
<div id="rotateTip"><div class="rt-phone"></div><b data-i18n="rotate_tip"></b></div>   <!-- 手機橫拿：請轉成直向 -->
<div id="app">
  <canvas id="cv"></canvas>
  <!-- 用來量瀏海高度（env(safe-area-inset-top)）的隱形元素 -->
  <div id="safeProbe" aria-hidden="true"></div>
  <div id="vhProbe" aria-hidden="true"></div>

  <!-- 標題 -->
  <div class="scr" id="title">
    <!-- 商店：獨立放在畫面左上角 -->
    <button class="shop-corner" data-act="shop" aria-label="shop"><span class="sc-glow"></span><img id="shopIc" alt=""><i class="sc-spk" style="--x:6%;--y:18%;--d:0s"></i><i class="sc-spk" style="--x:86%;--y:10%;--d:.8s"></i><i class="sc-spk" style="--x:92%;--y:62%;--d:1.6s"></i><i class="sc-spk" style="--x:2%;--y:66%;--d:2.3s"></i></button>
    <!-- 出場動畫：① LOGO 出現、忍者從左邊在 LOGO 上連跳三下往右出畫面 → ② LOGO 上移 → ③ 忍術陣中忍者現身放大 -->
    <div class="logo" id="intro">
      <div class="logo-box">
        <img class="logo-img" src="assets/logo.webp" alt="忍者鳶 TOBI NINJA TOBI">
      </div>
      <div class="jutsu">
        <div class="jutsu-lines"></div>
        <div class="jutsu-ring"><b>忍</b></div>
        <div class="jutsu-flash"></div>
        <span class="puff" style="--dx:-38%;--dy:-20%"></span><span class="puff" style="--dx:36%;--dy:-26%"></span>
        <span class="puff" style="--dx:-30%;--dy:28%"></span><span class="puff" style="--dx:34%;--dy:24%"></span>
        <span class="puff" style="--dx:0%;--dy:-40%"></span><span class="puff" style="--dx:2%;--dy:38%"></span>
      </div>
      <img class="hero-art hero-tint" id="heroArt" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="">
    </div>
    <div class="menu">
      <button data-act="start" class="big red" data-i18n="start"></button>
      <div class="coinbar"><span data-i18n="koban"></span> <b id="tCoins">0</b></div>
    </div>
    <!-- 底部選單：鐵灰方塊＋金色字，橫向一列 -->
    <nav class="dock">
      <button data-act="rank"><i class="scroll-ic" data-ic="rank"></i><span data-i18n="rank"></span></button>
      <button data-act="help"><i class="scroll-ic" data-ic="help"></i><span data-i18n="help"></span></button>
      <button data-act="hist"><i class="scroll-ic" data-ic="hist"></i><span data-i18n="hist"></span></button>
      <button data-act="opt"><i class="scroll-ic" data-ic="opt"></i><span data-i18n="opt"></span></button>
      <button data-act="credit"><i class="scroll-ic" data-ic="credit"></i><span data-i18n="credit"></span></button>
    </nav>
  </div>

  <!-- 暫停 -->
  <div class="scr dim" id="pause">
    <div class="panel">
      <h2 data-i18n="paused"></h2>
      <div class="pause-sk" id="pauseSk"></div>   <!-- 目前已獲得的技能與秘傳 -->
      <button data-act="resume" class="big" data-i18n="resume"></button>
      <button data-act="help" data-i18n="help"></button>
      <button data-act="quit" data-i18n="giveup"></button>
    </div>
  </div>

  <!-- 秘傳選擇 -->
  <div class="scr dim" id="perk">
    <div class="panel wide">
      <h2 id="perkTitle"></h2>
      <div id="perkCards"></div>
    </div>
  </div>

  <!-- 主線通關：挑戰無盡或結算 -->
  <div class="scr dim" id="clear">
    <div class="panel">
      <h2 data-i18n="clear_title"></h2>
      <p class="clear-body" id="clearBody"></p>
      <button data-act="finish" class="big red" data-i18n="clear_end"></button>
    </div>
  </div>

  <!-- 選關：四大關的圖卡（levels.js） -->
  <div class="scr dim" id="lvsel">
    <div class="panel wide lvsel">
      <h2 data-i18n="lv_title"></h2>
      <div class="lv-list" id="lvList"></div>
      <div class="lv-jutsu" id="lvJutsu"></div>   <!-- 帶進關卡的忍法（打倒各關第 10 舞台魔王取得卷軸後解鎖） -->
      <button class="lv-tut" data-act="tutorial" data-i18n="tutorial"></button>
      <button data-act="back" data-i18n="back"></button>
    </div>
  </div>

  <!-- 完整版介紹（levels.js）：林關免費，風、山、火要購買 -->
  <div class="scr dim" id="full">
    <div class="panel wide full">
      <h2 data-i18n="full_title"></h2>
      <p class="full-lead" id="fullLead"></p>
      <div class="full-lvs" id="fullLvs"></div>
      <ul class="full-list" id="fullList"></ul>
      <div class="full-price" data-i18n="full_price"></div>
      <button data-act="fullbuy" id="fullBuy" class="big red" data-i18n="full_buy"></button>
      <button data-act="fullclose" data-i18n="full_later"></button>
    </div>
  </div>

  <!-- 倒下時：看廣告復活（ads.js，每局一次） -->
  <div class="scr dim" id="cont">
    <div class="panel cont">
      <h2 data-i18n="cont_title"></h2>
      <div class="cont-time" id="contTime">5</div>
      <p class="cont-desc" data-i18n="cont_desc"></p>
      <button data-act="contad" class="big red" data-i18n="cont_ad"></button>
      <button data-act="contgive" data-i18n="cont_give"></button>
    </div>
  </div>

  <!-- 結算 -->
  <div class="scr dim" id="over">
    <!-- 結算（成績卡片）：分數＋新紀錄、六格成績、小判列（含看廣告 ×2）、到達舞台 -->
    <div class="panel ovp">
      <h2 id="overTitle"></h2>
      <div id="overBody"></div>
      <div class="ov-koban"><span id="overCoins"></span><button data-act="adcoins" id="adCoins" class="ad-btn"></button></div>   <!-- 看廣告，小判 ×2（ads.js） -->
      <div class="ov-reach" id="overReach"></div>
      <button data-act="retry" class="big red" data-i18n="retry"></button>
      <div class="row">
        <button data-act="shop" data-i18n="shop"></button>
        <button data-act="title" data-i18n="to_title"></button>
      </div>
    </div>
  </div>

  <!-- 商店 -->
  <div class="scr dim" id="shop">
    <div class="panel wide">
      <h2><span data-i18n="shop"></span> <span class="coin"><span data-i18n="koban"></span> <b id="sCoins">0</b></span></h2>
      <div class="tabs" id="shopTabs"></div>
      <div id="shopBody" class="list"></div>
      <button data-act="back" data-i18n="back"></button>
    </div>
  </div>

  <!-- 排行 -->
  <div class="scr dim" id="rank">
    <div class="panel wide">
      <h2 data-i18n="rank"></h2>
      <div class="tabs" id="rankTabs"></div>
      <div id="rankBody" class="list"></div>
      <button data-act="back" data-i18n="back"></button>
    </div>
  </div>

  <!-- 設定 -->
  <div class="scr dim" id="opt">
    <!-- 設定（分組卡片）：聲音（音樂／音效各 0～5 格）、遊戲（震動、語言），下方三個圖示方塊 -->
    <div class="panel opt">
      <h2 data-i18n="opt"></h2>
      <div class="og">
        <div class="og-h" data-i18n="opt_sound"></div>
        <div class="og-it"><span class="og-l">🎵 <b data-i18n="mus"></b></span><span class="vol"><button class="pm" data-act="vol" data-arg="mus:-1">−</button><span class="seg" id="segMus"></span><button class="pm" data-act="vol" data-arg="mus:1">＋</button></span></div>
        <div class="og-it"><span class="og-l">🔊 <b data-i18n="sfx"></b></span><span class="vol"><button class="pm" data-act="vol" data-arg="sfx:-1">−</button><span class="seg" id="segSfx"></span><button class="pm" data-act="vol" data-arg="sfx:1">＋</button></span></div>
      </div>
      <div class="og">
        <div class="og-h" data-i18n="opt_game"></div>
        <div class="og-it"><span class="og-l">📳 <b data-i18n="vib_n"></b></span><button class="sw" id="bVib" data-act="vib" aria-label="vibration"></button></div>
        <div class="og-it"><span class="og-l">🌐 <b data-i18n="lang_n"></b></span><span class="pills" id="langPills"></span></div>
      </div>
      <button data-act="fulltest" id="bFull" class="opt-test"></button>   <!-- 測試模式：切換是否擁有完整版 -->
      <div class="tiles">
        <button class="tile" data-act="replay"><em>🎬</em><span data-i18n="replay"></span></button>
        <button class="tile" data-act="privacy"><em>📄</em><span data-i18n="privacy"></span></button>
        <button class="tile red" data-act="reset" id="bReset"><em>🗑️</em><span id="bResetT"></span></button>
      </div>
      <button data-act="back" data-i18n="back"></button>
      <small id="diag" class="diag"></small>
    </div>
  </div>

  <!-- 說明 -->
  <div class="scr dim" id="help">
    <div class="panel wide">
      <h2 data-i18n="help"></h2>
      <!-- 分類分頁：◀ 分類名稱＋頁點 ▶，內容可左右滑動切頁 -->
      <div class="hp-nav">
        <button class="hp-arrow" data-act="hp-prev" aria-label="prev">◀</button>
        <div class="hp-head"><b id="hpTitle"></b><span class="hp-dots" id="hpDots"></span></div>
        <button class="hp-arrow" data-act="hp-next" aria-label="next">▶</button>
      </div>
      <div class="hp-page" id="hpPage"></div>
      <button data-act="back" id="helpBtn" class="big"></button>
    </div>
  </div>

  <!-- 製作名單（照 yaki_mochi 的做法：一行一行淡入，下方是主角插圖與版權） -->
  <!-- 了解歷史（照 mouse-hit 專案：三個分頁、可捲動；第三頁附團隊 LOGO 與粉絲團連結） -->
  <div class="scr dim" id="hist">
    <div class="panel wide hist">
      <h2 data-i18n="hist"></h2>
      <div class="hs-tabs" id="histTabs"></div>
      <div class="hs-body" id="histBody"></div>
      <a class="hs-fb" id="histFb" target="_blank" rel="noopener noreferrer" data-i18n="hist_fb"></a>
      <button data-act="back" data-i18n="back"></button>
    </div>
  </div>

  <div class="scr dim" id="credit">
    <div class="panel credit">
      <h2>CREDIT <small data-i18n="credit"></small></h2>
      <div class="cr-line cr-role" style="--d:0" data-i18n="cr_r1"></div>
      <div class="cr-line cr-name" style="--d:1">Arc Wang</div>
      <div class="cr-line cr-role" style="--d:2" data-i18n="cr_r2"></div>
      <div class="cr-line cr-val" style="--d:3" data-i18n="cr_v2"></div>
      <div class="cr-line cr-role" style="--d:4" data-i18n="cr_r3"></div>
      <div class="cr-line cr-val" style="--d:5" data-i18n="cr_v3"></div>
      <div class="cr-line cr-art" style="--d:6">

        <img class="hero-tint" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="">
      </div>
      <div class="cr-line cr-game" style="--d:7">忍者鳶 NINJA TOBI</div>
      <div class="cr-line cr-copy" style="--d:8">© 2026 Arc Concept Games</div>
      <button data-act="back" data-i18n="back"></button>
    </div>
  </div>


  <button id="tutSkip" class="tut-skip" data-act="tutskip" data-i18n="tut_skip"></button>   <!-- 新手教學：跳過 -->
  <div id="toast"></div>
  <!-- 假廣告（測試用，上架時換成 AdMob） -->
  <div id="adFake"><div class="ad-box"><button class="ad-x" id="adFakeX">✕</button><b data-i18n="ad_test"></b><small data-i18n="ad_test2"></small><div class="ad-t" id="adFakeT"></div><button class="big red" id="adFakeOk" data-i18n="ad_claim"></button></div></div>
</div>
<!-- 開場遮罩：等畫面尺寸量穩了才拿掉，避免一開啟就看到版面跳動 -->
<div id="boot" aria-hidden="true"><img src="assets/team_logo.webp" alt=""></div>
<script src="lang.js"></script>
<script src="music.js"></script>
<script src="art.js"></script>
<script src="foes2.js"></script>
<script src="chars.js"></script>
<script src="sidebg.js"></script>
<script src="cut.js"></script>
<script src="game.js"></script>
<script src="ads.js"></script>
<script src="stagefx.js"></script>
<script src="levels.js"></script>
<script src="tutorial.js"></script>
<script src="help.js"></script>
<script src="history.js"></script>
</body>
</html>
