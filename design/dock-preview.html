<!doctype html>
<meta charset="utf-8"><title>底部選單圖示（護額）</title>
<style>html,body{margin:0;background:#161c1e}canvas{display:block}#title{display:none}</style>
<canvas id="cv"></canvas><div id="title"></div><div id="intro"></div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), $ = id => document.getElementById(id);
const INK = '#0e1414', g = null, WALL = 14, FONT = '"Noto Sans TC","Noto Sans JP","Microsoft JhengHei",sans-serif';
let W = 720, H = 270, SAFE_T = 0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const save = { skin: 0 }, SFX = new Proxy({}, { get: () => () => {} }), tone = () => {}, noise = () => {};
function txt(s, x, y, size, color = '#fff', align = 'center', stroke = '#000', lw = 4) { ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); } ctx.fillStyle = color; ctx.fillText(s, x, y); }
</script>

['中文', '日本語', 'English'].forEach((n, li) => { LI = li; txt(n, 50, 46 + li * 86, 13, '#c8d0d6', 'center', null); ['shop', 'rank', 'help', 'opt', 'credit'].forEach((k, i) => ctx.drawImage(dockPlate(k, 220), 110 + i * 120, 8 + li * 86, 78, 78)); });
