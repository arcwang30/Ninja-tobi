<title>鞍馬大天狗 酷酷版</title>
<style>html, body { margin: 0; background: #1d3a4a; } canvas { display: block; } #title { display: none; }</style>
<canvas id="cv"></canvas><div id="title"></div><div id="intro"></div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), $ = id => document.getElementById(id);
const INK = '#0e1414', g = null, WALL = 14, FONT = '"Noto Sans TC","Microsoft JhengHei",sans-serif';
let W = 960, H = 640, SAFE_T = 0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const SKINS = [{ n: '鳶', suit: '#c0262d', dark: '#7a1218', band: '#ffffff' }];
const save = { skin: 0 }, SFX = new Proxy({}, { get: () => () => {} }), tone = () => {}, noise = () => {};
function txt(s, x, y, size, color = '#fff', align = 'center', stroke = '#000', lw = 4) { ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); } ctx.fillStyle = color; ctx.fillText(s, x, y); }
</script>

<script>
'use strict';
/* 鞍馬大天狗・酷酷版三案（日式風格；鼻子是一條粗細均勻、前端圓頭的「小黃瓜」形長鼻，往前直直伸出）
   原點在身體中心，頭在 (0,-38)，臉朝右前方（3/4 側面） */
const HX = 0, HY = -38, HR = 19;
// 小黃瓜形長鼻：粗細一致的圓頭長條，上亮下暗，有一條高光與兩三個小顆粒
function longNose(c, x, y, len, th, ang) {
  c.save(); c.translate(x, y); c.rotate(ang);
  aRR(c, -3, -th / 2, len + 3, th, th / 2);
  const gr = c.createLinearGradient(0, -th / 2, 0, th / 2); gr.addColorStop(0, '#f27a62'); gr.addColorStop(.45, '#d8463a'); gr.addColorStop(1, '#9a2820');
  c.fillStyle = gr; c.fill(); aInk(c, 1.8);
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.4; c.lineCap = 'round'; c.beginPath(); c.moveTo(4, -th * .28); c.lineTo(len - th * .6, -th * .28); c.stroke();
  c.fillStyle = 'rgba(255,210,190,.55)'; for (const px of [.35, .6, .82]) { aCirc(c, len * px, th * .08, .9); c.fill(); }
  c.fillStyle = 'rgba(120,20,20,.35)'; aCirc(c, len - th * .35, th * .18, 1.1); c.fill();   // 鼻孔
  c.restore();
}
// 臉：紅色、3/4 側面；細長金色鳳眼＋往內壓的濃眉；嚴肅的嘴
function face(c, o) {
  aCirc(c, HX, HY, HR); c.fillStyle = bossBall(c, HX - 2, HY - 2, HR, '#ff8a6a', '#d23a2c', '#8e1c16'); c.fill(); aInk(c, 2);
  c.save(); aCirc(c, HX, HY, HR); c.clip(); c.fillStyle = 'rgba(0,0,0,.18)'; aEll(c, HX - 14, HY + 2, 8, 18); c.fill(); c.restore();   // 側面的暗部
  for (const [ex, w] of [[-4, .8], [10, 1]]) {   // 鳳眼（遠的那隻窄一點）
    c.save(); c.translate(HX + ex, HY - 4); c.rotate(-.18); c.scale(1.3, 1.3);
    c.beginPath(); c.moveTo(-5 * w, 1); c.quadraticCurveTo(0, -4.5, 5.5 * w, -1); c.quadraticCurveTo(0, 2.5, -5 * w, 1); c.closePath();
    c.fillStyle = '#fff6d8'; c.fill(); c.save(); c.clip(); aCirc(c, 1.5, -.6, 3.2); c.fillStyle = o.eye || '#e8a81e'; c.fill(); aEll(c, 1.5, -.6, .9, 2.6); c.fillStyle = INK; c.fill(); c.restore();
    c.strokeStyle = INK; c.lineWidth = 1.6; c.stroke();
    c.restore();
  }
  c.fillStyle = o.brow || '#f4f6fa';   // 濃眉（內側往下壓）
  for (const [bx, sd] of [[-3, -1], [9, 1]]) { c.beginPath(); c.moveTo(HX + bx - 7 * (sd < 0 ? 1 : .2), HY - 12); c.quadraticCurveTo(HX + bx, HY - 15, HX + bx + 7, HY - 11.5); c.lineTo(HX + bx + 6, HY - 9); c.quadraticCurveTo(HX + bx, HY - 11, HX + bx - 6, HY - 9); c.closePath(); c.fill(); aInk(c, 1.2); }
  c.strokeStyle = INK; c.lineWidth = 1.6; c.beginPath(); c.moveTo(HX + 1, HY + 12); c.quadraticCurveTo(HX + 6, HY + 10.5, HX + 11, HY + 12.5); c.stroke();
}
// 白色長髮：一束一束往後飄
function mane(c, t, o) {
  const sw = Math.sin(t * 2) * 2;
  c.fillStyle = '#f2f4f8';
  for (let i = 0; i < 6; i++) {
    const y0 = HY - 14 + i * 5, len = 40 + i * 6 + (o.long || 0), up = o.up ? -14 + i * 2 : 0;
    c.beginPath(); c.moveTo(HX - 6, y0 - 3); c.quadraticCurveTo(HX - 22, y0 - 8 + up, HX - len + sw, y0 + 10 + i * 4 + up); c.quadraticCurveTo(HX - 24, y0 + 6 + up * .5, HX - 4, y0 + 4); c.closePath(); c.fill(); aInk(c, 1.4);
    c.strokeStyle = 'rgba(150,165,185,.6)'; c.lineWidth = .9; c.beginPath(); c.moveTo(HX - 12, y0 + 1); c.quadraticCurveTo(HX - 24, y0 + 2 + up * .5, HX - len * .8 + sw, y0 + 9 + i * 3 + up); c.stroke();
  }
}
function beard(c) { c.beginPath(); c.moveTo(HX - 6, HY + 12); c.quadraticCurveTo(HX + 2, HY + 16, HX + 12, HY + 12); c.quadraticCurveTo(HX + 9, HY + 26, HX + 4, HY + 34); c.quadraticCurveTo(HX - 1, HY + 24, HX - 6, HY + 12); c.closePath(); c.fillStyle = '#f4f6fa'; c.fill(); aInk(c, 1.4); c.strokeStyle = 'rgba(150,165,185,.6)'; c.lineWidth = .9; c.beginPath(); c.moveTo(HX + 2, HY + 15); c.quadraticCurveTo(HX + 5, HY + 24, HX + 4, HY + 31); c.stroke(); }
// 和服上身：交叉衣襟、寬袖；col 外衣、inner 襯衣、hakama 袴
function kimono(c, o) {
  heroSilhouette(c, [
    ...[-1, 1].map(sd => ({ path: c => { c.beginPath(); c.moveTo(sd * 16, -22); c.quadraticCurveTo(sd * 34, -18, sd * 38, 4); c.lineTo(sd * 30, 16); c.quadraticCurveTo(sd * 22, 4, sd * 16, -4); c.closePath(); }, fill: o.col })),   // 寬袖
    { path: c => { c.beginPath(); c.moveTo(-20, -22); c.quadraticCurveTo(0, -26, 20, -22); c.lineTo(24, 10); c.lineTo(-24, 10); c.closePath(); }, fill: o.col },
    { path: c => { c.beginPath(); c.moveTo(-24, 8); c.lineTo(24, 8); c.lineTo(30, 40); c.quadraticCurveTo(0, 44, -30, 40); c.closePath(); }, fill: o.hakama,
      after: c => { c.save(); c.clip(); c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1.2; for (const x of [-16, -6, 4, 14]) { c.beginPath(); c.moveTo(x, 10); c.lineTo(x * 1.2, 42); c.stroke(); } c.restore(); } },
  ], 2);
  c.fillStyle = o.inner; c.beginPath(); c.moveTo(-8, -24); c.lineTo(3, -6); c.lineTo(10, -24); c.lineTo(6, -24); c.lineTo(3, -12); c.lineTo(-4, -24); c.closePath(); c.fill();
  c.strokeStyle = INK; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-10, -24); c.lineTo(3, -4); c.lineTo(12, -22); c.stroke();
  c.fillStyle = o.obi; c.fillRect(-24, 4, 48, 6); c.strokeStyle = INK; c.lineWidth = 1.2; c.strokeRect(-24, 4, 48, 6);
}
const DESIGNS = [
  ['A　山伏武者', '深藍山伏衣斜披橘色袈裟與三顆白梵天；白長髮往後飄、尖尖白鬍；右手把羽團扇舉在肩旁、左手直握錫杖，眼神銳利', (c, t) => {
    const fl = Math.sin(t * 4);
    c.save(); c.translate(0, -18); wing(c, -1, 70, 56, 8, '#14151e', '#2e3044', fl * .35); wing(c, 1, 70, 56, 8, '#14151e', '#2e3044', fl * .35); c.restore();
    mane(c, t, {});
    staff(c, -34, 48, -34, -52);
    for (const sd of [-1, 1]) geta1(c, sd * 12, 46, 1.5);
    kimono(c, { col: '#2a3a6a', inner: '#f4f0e4', hakama: '#1e2a4e', obi: '#c0262d' });
    c.save(); c.beginPath(); c.moveTo(-20, -22); c.lineTo(-12, -24); c.lineTo(24, 8); c.lineTo(16, 10); c.closePath(); c.fillStyle = '#e8862a'; c.fill(); aInk(c, 1.4); c.restore();   // 袈裟
    for (let i = 0; i < 3; i++) bonten(c, -10 + i * 10, -14 + i * 8, 3.6, '#ffffff');
    aCirc(c, -34, 4, 6); aFI(c, '#d23a2c', 1.8);   // 握錫杖的手
    face(c, {}); beard(c); tokin(c, HX + 2, HY - 19, 1.5);
    longNose(c, HX + 6, HY + 5, 30, 8, -.12);
    featherFan(c, 34, -26, 1.15, .3, '#ffffff', '#e8eef4'); aCirc(c, 34, -22, 6); aFI(c, '#d23a2c', 1.8);
  }],
  ['B　烏羽大將', '黑羽織上有金色團扇家紋、紅色內襯；雙手抱胸、白髮高高束成馬尾往後揚；巨大黑翼帶紫色光澤，沉穩又有壓迫感', (c, t) => {
    const fl = Math.sin(t * 3);
    c.save(); c.translate(0, -18); wing(c, -1, 80, 62, 9, '#1a1426', '#4a3a6e', fl * .3); wing(c, 1, 80, 62, 9, '#1a1426', '#4a3a6e', fl * .3); c.restore();
    mane(c, t, { up: 1, long: 6 });
    for (const sd of [-1, 1]) geta1(c, sd * 12, 46, 1.5, '#3a2a24');
    kimono(c, { col: '#1c1c26', inner: '#c0262d', hakama: '#2a2a36', obi: '#e8b84a' });
    for (const sd of [-1, 1]) { aCirc(c, sd * 13, -12, 5); c.fillStyle = '#e8b84a'; c.fill(); aInk(c, 1.2); c.save(); c.translate(sd * 13, -12); c.fillStyle = '#1c1c26'; for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * .45; c.beginPath(); c.moveTo(0, 2); c.lineTo(Math.cos(a) * 4, Math.sin(a) * 4 + 1); c.lineTo(Math.cos(a + .2) * 3, Math.sin(a + .2) * 3 + 1); c.closePath(); c.fill(); } c.restore(); }   // 團扇家紋
    // 雙手抱胸：兩隻寬袖在胸前交疊
    for (const sd of [1, -1]) { c.beginPath(); c.moveTo(-sd * 22, -8); c.quadraticCurveTo(0, 2, sd * 20, -6); c.lineTo(sd * 22, 4); c.quadraticCurveTo(0, 10, -sd * 20, 2); c.closePath(); c.fillStyle = '#26262f'; c.fill(); aInk(c, 1.6); aCirc(c, sd * 21, -1, 5); aFI(c, '#d23a2c', 1.6); }
    face(c, { eye: '#ffcc33', brow: '#e8ecf2' }); beard(c); tokin(c, HX + 2, HY - 19, 1.5, '#16161e');
    longNose(c, HX + 6, HY + 5, 32, 8, -.1);
  }],
  ['C　鞍馬劍聖', '傳說中教牛若丸劍術的天狗：白色上衣配紅袴，雙手把太刀高舉過肩，羽團扇插在腰後；長髮與翅膀隨風翻飛', (c, t) => {
    const fl = Math.sin(t * 5);
    c.save(); c.translate(0, -18); wing(c, -1, 72, 56, 8, '#14151e', '#2e3044', fl * .45, 1); wing(c, 1, 72, 56, 8, '#14151e', '#2e3044', fl * .45, 1); c.restore();
    mane(c, t, { long: 12 });
    featherFan(c, -22, 6, .8, -.9, '#ffffff', '#e8eef4');   // 插在腰後的羽團扇
    for (const sd of [-1, 1]) geta1(c, sd * 12, 46, 1.5);
    kimono(c, { col: '#f2eee4', inner: '#c0262d', hakama: '#b8202a', obi: '#1c1c26' });
    // 太刀：雙手握在右肩上方，刀身往左上斜舉
    c.save(); c.translate(22, -30); c.rotate(-2.4);
    c.beginPath(); c.moveTo(4, -2.2); c.quadraticCurveTo(30, -5, 62, -1); c.lineTo(60, 2.2); c.quadraticCurveTo(30, 1, 4, 2.2); c.closePath(); const bg = c.createLinearGradient(0, -3, 0, 3); bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, '#a8b2c0'); c.fillStyle = bg; c.fill(); aInk(c, 1.4);
    c.strokeStyle = 'rgba(120,150,190,.7)'; c.lineWidth = .8; c.beginPath(); for (let x = 8; x < 58; x += 6) c.lineTo(x, (x / 6 % 2 ? .6 : 1.4)); c.stroke();
    aEll(c, 2, 0, 2.4, 6); aFI(c, '#e8b84a', 1.2); c.beginPath(); c.rect(-16, -2.4, 16, 4.8); aFI(c, '#1c1c26', 1.4);
    c.fillStyle = '#f2f2f2'; for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(-14 + i * 5, 0); c.lineTo(-12 + i * 5, -2); c.lineTo(-10 + i * 5, 0); c.lineTo(-12 + i * 5, 2); c.closePath(); c.fill(); }
    c.restore();
    aCirc(c, 26, -27, 6); aFI(c, '#d23a2c', 1.8); aCirc(c, 33, -22, 6); aFI(c, '#d23a2c', 1.8);
    face(c, { eye: '#ffd25a' }); beard(c); tokin(c, HX + 2, HY - 19, 1.5);
    longNose(c, HX + 6, HY + 5, 30, 8, -.14);
  }],
];
const DPR = 2; cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.scale(DPR, DPR);
const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#2a4a6a'); bg.addColorStop(1, '#14283a'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
txt('鞍馬大天狗・酷酷版三案（日式；小黃瓜形長鼻）', 24, 28, 20, '#ffe28a', 'left', '#000', 4);
txt('臉朝右前方、鼻子是一條粗細均勻的圓頭長條；大圖＋遊戲中的實際大小', 24, 56, 13, '#c8d8e4', 'left', null);
DESIGNS.forEach(([name, desc, fn], i) => {
  const x = 160 + i * 320, y = 290;
  ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.beginPath(); ctx.roundRect(x - 148, 76, 296, 548, 16); ctx.fill();
  ctx.save(); ctx.translate(x, y); ctx.scale(2.1, 2.1); fn(ctx, .6 + i); ctx.restore();
  txt(name, x, 470, 20, '#ffffff', 'center', '#000', 4);
  ctx.font = `700 12.5px ${FONT}`; ctx.fillStyle = '#d6e2ea'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  let line = '', ly = 494; for (const ch of desc) { if (ctx.measureText(line + ch).width > 268) { ctx.fillText(line, x - 134, ly); line = ch; ly += 19; } else line += ch; } ctx.fillText(line, x - 134, ly);
  txt('遊戲中大小', x + 90, 594, 11, 'rgba(255,255,255,.55)', 'center', null);
  ctx.save(); ctx.translate(x + 26, 588); ctx.scale(.62, .62); fn(ctx, .6 + i); ctx.restore();
});
</script>
