<!doctype html>
<meta charset="utf-8"><title>底部選單圖示提案</title>
<style>html,body{margin:0;background:#161c1e}canvas{display:block}#title{display:none}</style>
<canvas id="cv"></canvas><div id="title"></div><div id="intro"></div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), $ = id => document.getElementById(id);
const INK = '#0e1414', g = null, WALL = 14, FONT = '"Noto Sans TC","Microsoft JhengHei",sans-serif';
let W = 960, H = 640, SAFE_T = 0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const SKINS = [{ n: '鳶', suit: '#c0262d', dark: '#7a1218', band: '#ffffff' }];
const save = { skin: 0 }, SFX = new Proxy({}, { get: () => () => {} }), tone = () => {}, noise = () => {};
function txt(s, x, y, size, color = '#fff', align = 'center', stroke = '#000', lw = 4) { ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); } ctx.fillStyle = color; ctx.fillText(s, x, y); }
</script>
<script src="../art.js"></script>
<script src="../cut.js"></script>
<script>
'use strict';
/* 底部選單圖示三案（簡潔、忍術風；說明文字放在圖示裡）。每個圖示畫在 100×100 的方框裡 */
const ITEMS = [['shop', '商店'], ['rank', '戰績'], ['help', '說明'], ['opt', '設定'], ['credit', '製作']];
// 單色線條圖案（col：線條顏色），中心 (0,0)，大小約 ±16
function glyph(c, k, col, lw = 3.2) {
  c.save(); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
  if (k === 'shop') { aEll(c, 0, 0, 10, 14); c.stroke(); for (const y of [-6, 0, 6]) { c.beginPath(); c.moveTo(-5, y); c.lineTo(5, y); c.stroke(); } }
  else if (k === 'rank') { c.beginPath(); c.moveTo(-11, -12); c.lineTo(11, -12); c.quadraticCurveTo(11, 4, 0, 5); c.quadraticCurveTo(-11, 4, -11, -12); c.stroke(); c.beginPath(); c.moveTo(0, 5); c.lineTo(0, 11); c.moveTo(-7, 13); c.lineTo(7, 13); c.stroke(); for (const sd of [-1, 1]) { c.beginPath(); c.arc(sd * 12, -6, 4.5, sd < 0 ? Math.PI * .5 : -Math.PI * .5, sd < 0 ? Math.PI * 1.5 : Math.PI * .5); c.stroke(); } }
  else if (k === 'help') { aRR(c, -12, -12, 24, 24, 4); c.stroke(); c.font = '900 20px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 0, 1); }
  else if (k === 'opt') { c.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; c.moveTo(Math.cos(a) * 8, Math.sin(a) * 8); c.lineTo(Math.cos(a) * 14, Math.sin(a) * 14); } c.stroke(); aCirc(c, 0, 0, 8.5); c.stroke(); aCirc(c, 0, 0, 3); c.fill(); }
  else { c.save(); c.rotate(.7); aRR(c, -2.6, -14, 5.2, 18, 2); c.stroke(); c.beginPath(); c.moveTo(-3.4, 4); c.quadraticCurveTo(0, 16, 3.4, 4); c.closePath(); c.fill(); c.restore(); c.beginPath(); c.moveTo(-12, 12); c.quadraticCurveTo(-4, 8, 2, 13); c.stroke(); }
  c.restore();
}
const STYLES = [
  ['A　朱印（印章）', '紅色的圓形印章，白色線條圖案＋文字，像蓋在卷軸上的忍者印', (c, k, label) => {
    c.save(); c.translate(50, 50);
    aCirc(c, 0, 0, 44); c.fillStyle = '#c0262d'; c.fill();
    c.strokeStyle = '#ffffff'; c.lineWidth = 2.4; aCirc(c, 0, 0, 38); c.stroke();
    c.fillStyle = 'rgba(0,0,0,.12)'; for (let i = 0; i < 6; i++) { aCirc(c, Math.cos(i * 2.3) * 30, Math.sin(i * 2.3) * 30, 2 + (i % 3)); c.fill(); }   // 朱泥的斑駁
    c.translate(0, -9); c.scale(1.05, 1.05); glyph(c, k, '#ffffff'); c.restore();
    c.font = `900 15px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#ffffff'; c.fillText(label, 50, 74);
  }],
  ['B　手裡劍徽章', '鋼色手裡劍當底，中間深色圓章放金色圖案，下方紅色布條寫文字', (c, k, label) => {
    c.save(); c.translate(50, 44); c.rotate(Math.PI / 4);
    c.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? 15 : 42, a = i * Math.PI / 4; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath();
    const sg = c.createLinearGradient(-40, -40, 40, 40); sg.addColorStop(0, '#eef2f8'); sg.addColorStop(1, '#7c8696'); c.fillStyle = sg; c.fill(); aInk(c, 2.6);
    c.restore();
    aCirc(c, 50, 44, 20); c.fillStyle = '#20262c'; c.fill(); aInk(c, 2.4);
    c.save(); c.translate(50, 44); c.scale(.82, .82); glyph(c, k, '#ffd25a', 3.4); c.restore();
    c.beginPath(); c.moveTo(14, 70); c.lineTo(86, 70); c.lineTo(80, 78); c.lineTo(86, 86); c.lineTo(14, 86); c.lineTo(20, 78); c.closePath(); c.fillStyle = '#c0262d'; c.fill(); aInk(c, 2);
    c.font = `900 14px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(label, 50, 78.5);
  }],
  ['C　護額', '忍者頭上的護額：布帶上綁著金屬板，板上刻著圖案和文字', (c, k, label) => {
    c.fillStyle = '#2a3a6a'; c.beginPath(); c.moveTo(0, 38); c.quadraticCurveTo(50, 30, 100, 38); c.lineTo(100, 64); c.quadraticCurveTo(50, 56, 0, 64); c.closePath(); c.fill(); aInk(c, 2);
    c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1; for (let x = 6; x < 100; x += 8) { c.beginPath(); c.moveTo(x, 38); c.lineTo(x, 62); c.stroke(); }
    aRR(c, 14, 14, 72, 72, 12); const mg = c.createLinearGradient(0, 14, 0, 86); mg.addColorStop(0, '#f4f6fa'); mg.addColorStop(.5, '#b8c0cc'); mg.addColorStop(1, '#8a94a4'); c.fillStyle = mg; c.fill(); aInk(c, 2.6);
    for (const [x, y] of [[21, 21], [79, 21], [21, 79], [79, 79]]) { aCirc(c, x, y, 2.6); c.fillStyle = '#6a7484'; c.fill(); c.strokeStyle = INK; c.lineWidth = 1; c.stroke(); }
    c.save(); c.translate(50, 42); glyph(c, k, '#2a3240', 3.6); c.restore();
    c.font = `900 14px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#2a3240'; c.fillText(label, 50, 71);
  }],
];
const DPR = 2; cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.scale(DPR, DPR);
ctx.fillStyle = '#20262b'; ctx.fillRect(0, 0, W, H);
txt('底部選單圖示提案（簡潔＋忍術風，文字在圖示裡；含新增的「製作」CREDIT）', 24, 26, 17, '#ffe28a', 'left', '#000', 4);
STYLES.forEach(([name, desc, fn], r) => {
  const y = 60 + r * 192;
  const gr = ctx.createLinearGradient(0, y, 0, y + 150); gr.addColorStop(0, '#2a3236'); gr.addColorStop(1, '#161c1e'); ctx.fillStyle = gr; ctx.fillRect(16, y, W - 32, 150);
  txt(name, 32, y + 20, 16, '#ffffff', 'left', '#000', 3);
  ctx.font = `700 12px ${FONT}`; ctx.fillStyle = '#b8c4cc'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(desc, 220, y + 20);
  ITEMS.forEach(([k, label], i) => { ctx.save(); ctx.translate(40 + i * 120, y + 38); ctx.scale(1.05, 1.05); fn(ctx, k, label); ctx.restore(); });
  // 實際大小（手機上約 54px）
  txt('實際大小', 770, y + 46, 11, 'rgba(255,255,255,.5)', 'left', null);
  ITEMS.forEach(([k, label], i) => { ctx.save(); ctx.translate(640 + i * 60, y + 64); ctx.scale(.54, .54); fn(ctx, k, label); ctx.restore(); });
});
</script>
