<script>
'use strict';
/* 天狗設定圖：?k=small（小天狗三案）／?k=big（大天狗三案）。每案：大圖＋遊戲中實際大小＋說明 */
const K = new URLSearchParams(location.search).get('k') || 'small';
const T = .6;
const lin = (c, y0, y1, a, b) => { const gr = c.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, a); gr.addColorStop(1, b); return gr; };
// 羽毛翅膀：從 (0,0) 往 sd 方向展開；n 片羽毛，len 長度，flap 拍翅（-1～1）
function wing(c, sd, len, h, n, col, edge, flap, tatter) {
  c.save(); c.scale(sd, 1); c.rotate(-flap * .35);
  const pts = [];
  for (let i = 0; i < n; i++) { const q = i / (n - 1), x = len * (.35 + .65 * Math.sin(q * Math.PI * .5 + .2)), y = -h * .55 + q * h * 1.15; pts.push([x, y]); }
  c.beginPath(); c.moveTo(0, -h * .2); c.quadraticCurveTo(len * .4, -h * .9, pts[0][0], pts[0][1]);
  pts.forEach(([x, y], i) => { const fl = tatter && i % 2 ? .82 : 1; c.lineTo(x * fl, y); if (i < n - 1) c.lineTo(x * .78, y + h * .06); });
  c.quadraticCurveTo(len * .3, h * .7, 0, h * .25); c.closePath();
  c.fillStyle = col; c.fill(); aInk(c, 2);
  c.strokeStyle = edge; c.lineWidth = 1.1;
  pts.forEach(([x, y]) => { c.beginPath(); c.moveTo(len * .18, y * .3); c.lineTo(x * .9, y); c.stroke(); });
  c.restore();
}
function tokin(c, x, y, s, col = '#1c1c22') {   // 頭襟（山伏的小黑帽）
  c.save(); c.translate(x, y); c.scale(s, s);
  c.beginPath(); c.moveTo(-7, 2); c.lineTo(-5, -5); c.lineTo(0, -8); c.lineTo(5, -5); c.lineTo(7, 2); c.quadraticCurveTo(0, 4, -7, 2); c.closePath(); aFI(c, col, 1.6);
  c.strokeStyle = '#c0262d'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-6, 2.5); c.quadraticCurveTo(0, 4.5, 6, 2.5); c.stroke();
  c.restore();
}
function bonten(c, x, y, r, col) { for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; aCirc(c, x + Math.cos(a) * r * .5, y + Math.sin(a) * r * .5, r * .55); c.fillStyle = col; c.fill(); } aCirc(c, x, y, r); c.strokeStyle = INK; c.lineWidth = 1.3; c.stroke(); }
function geta1(c, x, y, s, col = '#a0703a') { c.save(); c.translate(x, y); c.scale(s, s); aRR(c, -6, -2, 12, 3.4, 1.4); aFI(c, col, 1.3); c.beginPath(); c.rect(-1.6, 1.4, 3.2, 6); aFI(c, '#6a4424', 1.2); c.strokeStyle = '#c0262d'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(-3, -2); c.lineTo(0, -5); c.lineTo(3, -2); c.stroke(); c.restore(); }
function yatsude(c, x, y, s, rot, col = '#4f9c48') {   // 八手的葉扇（天狗的團扇）
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  c.beginPath(); c.rect(-1.2, 0, 2.4, 10); aFI(c, '#7a5230', 1);
  c.beginPath(); for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + (i - 3) * .42; c.lineTo(Math.cos(a - .12) * 6, Math.sin(a - .12) * 6); c.lineTo(Math.cos(a) * 16, Math.sin(a) * 16); c.lineTo(Math.cos(a + .12) * 6, Math.sin(a + .12) * 6); } c.closePath(); aFI(c, col, 1.3);
  c.strokeStyle = 'rgba(20,60,20,.6)'; c.lineWidth = .8; for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + (i - 3) * .42; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * 13, Math.sin(a) * 13); c.stroke(); }
  c.restore();
}
function featherFan(c, x, y, s, rot, col, tip, eye) {   // 羽團扇
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  c.beginPath(); c.rect(-1.6, 0, 3.2, 13); aFI(c, '#8e1c16', 1.2); aCirc(c, 0, 14, 2.2); aFI(c, '#e8b84a', 1);
  for (let i = 0; i < 9; i++) { const a = -Math.PI / 2 + (i - 4) * .27; c.save(); c.rotate(a + Math.PI / 2); c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(-4, -12, 0, -24); c.quadraticCurveTo(4, -12, 0, 0); c.fillStyle = i % 2 ? col : tip; c.fill(); aInk(c, 1); if (eye) { aEll(c, 0, -18, 2.4, 3.2); c.fillStyle = eye[0]; c.fill(); aCirc(c, 0, -18, 1.2); c.fillStyle = eye[1]; c.fill(); } c.restore(); }
  c.restore();
}
function staff(c, x0, y0, x1, y1) {   // 錫杖
  c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); c.strokeStyle = '#8a6a3a'; c.lineWidth = 2.2; c.stroke();
  aEll(c, x1, y1 - 5, 5, 7); c.strokeStyle = INK; c.lineWidth = 3.4; c.stroke(); c.strokeStyle = '#e8b84a'; c.lineWidth = 2; c.stroke();
  for (const sd of [-1, 1]) { aCirc(c, x1 + sd * 5, y1 - 2, 2.4); c.strokeStyle = '#e8b84a'; c.lineWidth = 1.4; c.stroke(); }
}
function claw(c, x, y, s, col) { c.save(); c.translate(x, y); c.scale(s, s); for (const a of [-.5, 0, .5]) { c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.sin(a) * 6, 5); c.strokeStyle = INK; c.lineWidth = 2.6; c.stroke(); c.strokeStyle = col; c.lineWidth = 1.4; c.stroke(); } aCirc(c, 0, 0, 2.6); aFI(c, col, 1.2); c.restore(); }

// ===== 小天狗三案（原點在身體中心，約 70 單位高） =====
const SMALL = [
  ['① 烏天狗', '烏鴉的嘴喙＋黑羽頭、小頭襟、白色山伏衣配橘色梵天球，一本齒木屐；抱著小葉扇俯衝', (c, t) => {
    const fl = Math.sin(t * 9);
    c.save(); c.translate(0, -2); wing(c, -1, 30, 26, 6, '#1c1d2a', '#3a3e56', fl); wing(c, 1, 30, 26, 6, '#1c1d2a', '#3a3e56', fl); c.restore();
    geta1(c, -6, 22, 1); geta1(c, 6, 22, 1);
    heroSilhouette(c, [
      { path: c => aEll(c, 0, 11, 9.5, 8.5), fill: '#f4f0e4', after: c => { c.save(); c.clip(); c.fillStyle = '#20202a'; c.fillRect(-12, 13, 24, 8); c.restore(); } },
      { path: c => { c.beginPath(); c.arc(0, -10, 15, 0, Math.PI * 2); for (let i = 0; i < 5; i++) { const a = -Math.PI * .9 + i * .3; c.moveTo(Math.cos(a) * 13, -10 + Math.sin(a) * 13); c.lineTo(Math.cos(a + .12) * 21, -10 + Math.sin(a + .12) * 21); c.lineTo(Math.cos(a + .24) * 13, -10 + Math.sin(a + .24) * 13); } }, fill: '#22232e',
        after: c => { c.save(); c.beginPath(); c.arc(0, -10, 15, 0, Math.PI * 2); c.clip(); const gr = c.createRadialGradient(-5, -16, 2, 0, -10, 17); gr.addColorStop(0, '#4a4e6a'); gr.addColorStop(1, '#16161e'); c.fillStyle = gr; c.fillRect(-16, -26, 32, 32); c.restore(); } },
    ], 1.7);
    bonten(c, -4, 6, 2.6, '#ff8a2a'); bonten(c, 4, 6, 2.6, '#ff8a2a');
    tokin(c, 0, -22, .9);
    for (const sd of [-1, 1]) bossEye(c, sd * 5.5 + 2, -12, 3.6, 4.2, '#d89a10', '#ffe85a');
    c.beginPath(); c.moveTo(-2, -7); c.quadraticCurveTo(10, -9, 19, -3); c.quadraticCurveTo(10, -1, -1, -2); c.closePath(); aFI(c, '#f2b81e', 1.5);   // 嘴喙
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = .8; c.beginPath(); c.moveTo(0, -4.5); c.lineTo(15, -4); c.stroke();
    claw(c, -13, 10, 1, '#f2b81e'); yatsude(c, 13, 6, .55, .4); claw(c, 13, 10, 1, '#f2b81e');
  }],
  ['② 木葉天狗', '貓頭鷹般的圓臉盤＋鉤嘴、葉子做的翅膀與頭冠，手拿八手葉扇；森林的小精怪', (c, t) => {
    const fl = Math.sin(t * 8);
    for (const sd of [-1, 1]) { c.save(); c.translate(sd * 6, 0); c.scale(sd, 1); c.rotate(-.5 - fl * .25);
      for (let i = 0; i < 3; i++) { c.save(); c.rotate(i * .45); c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(12, -9, 28, -2); c.quadraticCurveTo(12, 7, 0, 0); c.fillStyle = ['#7ac25a', '#5fae4a', '#3f8a36'][i]; c.fill(); aInk(c, 1.4); c.strokeStyle = 'rgba(20,60,20,.6)'; c.lineWidth = .8; c.beginPath(); c.moveTo(2, 0); c.lineTo(25, -2); c.stroke(); c.restore(); }
      c.restore(); }
    claw(c, -5, 21, .9, '#e8a84a'); claw(c, 5, 21, .9, '#e8a84a');
    heroSilhouette(c, [
      { path: c => aEll(c, 0, 11, 9, 9), fill: '#8a5a32', after: c => { c.save(); c.clip(); c.fillStyle = '#d8b88a'; aEll(c, 0, 13, 5.5, 6); c.fill(); c.strokeStyle = '#8a5a32'; c.lineWidth = 1; for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(0, 10 + i * 3.5, 3, .3, Math.PI - .3); c.stroke(); } c.restore(); } },
      { path: c => { c.beginPath(); c.arc(0, -9, 15.5, 0, Math.PI * 2); for (const sd of [-1, 1]) { c.moveTo(sd * 9, -21); c.lineTo(sd * 15, -30); c.lineTo(sd * 14, -18); c.closePath(); } }, fill: '#9a6a3c',
        after: c => { c.save(); c.beginPath(); c.arc(0, -9, 15.5, 0, Math.PI * 2); c.clip(); const gr = c.createRadialGradient(-5, -15, 2, 0, -9, 18); gr.addColorStop(0, '#c49a6a'); gr.addColorStop(1, '#6a4422'); c.fillStyle = gr; c.fillRect(-16, -26, 32, 34); c.restore(); } },
    ], 1.7);
    for (const sd of [-1, 1]) { aCirc(c, sd * 6, -9, 7); c.fillStyle = '#f4e4c4'; c.fill(); c.strokeStyle = '#6a4422'; c.lineWidth = 1; c.stroke(); bossEye(c, sd * 6, -9, 4.4, 4.6, '#e07a10', '#ffd25a'); }
    c.beginPath(); c.moveTo(-2.5, -4); c.quadraticCurveTo(0, -1, 2.5, -4); c.lineTo(0, 1.5); c.closePath(); aFI(c, '#f2a81e', 1.2);
    // 葉子頭冠
    for (let i = -2; i <= 2; i++) { c.save(); c.translate(i * 4, -24); c.rotate(i * .35); c.beginPath(); c.moveTo(0, 2); c.quadraticCurveTo(-3, -4, 0, -9); c.quadraticCurveTo(3, -4, 0, 2); c.fillStyle = i % 2 ? '#7ac25a' : '#4f9c48'; c.fill(); aInk(c, 1); c.restore(); }
    claw(c, -13, 9, .9, '#e8a84a'); yatsude(c, 14, 4, .7, .3, '#3f8a36'); claw(c, 14, 9, .9, '#e8a84a');
  }],
  ['③ 豆天狗', '圓滾滾的紅臉小鬼頭：短短的圓鼻、大頭襟、白色亂髮與調皮的笑臉，背著小翅膀拿羽扇', (c, t) => {
    const fl = Math.sin(t * 11);
    c.save(); c.translate(0, 2); wing(c, -1, 18, 16, 4, '#262633', '#44465e', fl); wing(c, 1, 18, 16, 4, '#262633', '#44465e', fl); c.restore();
    geta1(c, -6, 22, .95); geta1(c, 6, 22, .95);
    heroSilhouette(c, [
      { path: c => aEll(c, 0, 12, 10, 8.5), fill: '#ffffff', after: c => { c.save(); c.clip(); c.fillStyle = '#e8eef4'; c.fillRect(-12, 14, 24, 8); c.restore(); } },
      { path: c => { c.beginPath(); c.arc(0, -8, 16, 0, Math.PI * 2); for (let i = 0; i < 7; i++) { const a = -Math.PI + i * .52; c.moveTo(Math.cos(a) * 14, -8 + Math.sin(a) * 14); c.lineTo(Math.cos(a + .26) * 21, -8 + Math.sin(a + .26) * 19); c.lineTo(Math.cos(a + .52) * 14, -8 + Math.sin(a + .52) * 14); } }, fill: '#f4f4f8' },
    ], 1.7);
    aCirc(c, 0, -6, 13.5); c.fillStyle = bossBall(c, 0, -6, 13.5, '#ff9a8a', '#e8463a', '#a82a22'); c.fill(); c.strokeStyle = INK; c.lineWidth = 1.6; c.stroke();
    bonten(c, -4, 8, 3, '#e8323c'); bonten(c, 4, 8, 3, '#e8323c');
    tokin(c, 0, -20, 1.25);
    for (const sd of [-1, 1]) bossEye(c, sd * 5.5, -8, 3.4, 4, '#3a1a0a', '#8a4a2a');
    c.fillStyle = INK; for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(sd * 2.5, -13.5); c.lineTo(sd * 9, -15); c.lineTo(sd * 9, -13); c.lineTo(sd * 2.5, -12); c.closePath(); c.fill(); }
    aEll(c, 3, -3, 4.6, 3.6, -.2); c.fillStyle = bossBall(c, 3, -3, 4.6, '#ffb0a0', '#e8584a', '#b0342a'); c.fill(); aInk(c, 1.3);   // 短圓鼻
    c.beginPath(); c.moveTo(-5, 1); c.quadraticCurveTo(1, 5.5, 7, 1); c.strokeStyle = INK; c.lineWidth = 1.5; c.stroke(); c.beginPath(); c.moveTo(4.5, 2.2); c.lineTo(5.3, 4.2); c.lineTo(6.1, 2); c.fillStyle = '#fff'; c.fill();
    c.fillStyle = 'rgba(255,200,200,.5)'; aEll(c, -9, -2, 2.6, 1.5); c.fill();
    aCirc(c, -14, 9, 3.4); aFI(c, '#e8463a', 1.4); featherFan(c, 15, 5, .45, .5, '#ffffff', '#e8eef4'); aCirc(c, 15, 9, 3.4); aFI(c, '#e8463a', 1.4);
  }],
];
// ===== 大天狗三案（原點在身體中心，約 130 單位高） =====
const BIG = [
  ['① 鞍馬大天狗', '紅臉長鼻、白色長髮與長鬚、頭襟；山伏衣配一排梵天球與大念珠，右手白羽團扇、左手錫杖，背後巨大黑翼', (c, t) => {
    const fl = Math.sin(t * 4);
    c.save(); c.translate(0, -6); wing(c, -1, 66, 56, 8, '#14151e', '#2e3044', fl * .4); wing(c, 1, 66, 56, 8, '#14151e', '#2e3044', fl * .4); c.restore();
    staff(c, -30, 44, -40, -36);
    geta1(c, -11, 44, 1.6); geta1(c, 11, 44, 1.6);
    heroSilhouette(c, [
      { path: c => { c.beginPath(); c.moveTo(-26, 0); c.quadraticCurveTo(-30, 24, -18, 38); c.lineTo(18, 38); c.quadraticCurveTo(30, 24, 26, 0); c.closePath(); }, fill: '#f2eee2',
        after: c => { c.save(); c.clip(); c.fillStyle = '#e8862a'; c.beginPath(); c.moveTo(-26, 4); c.lineTo(-4, 38); c.lineTo(6, 38); c.lineTo(-16, 0); c.closePath(); c.fill(); c.fillStyle = 'rgba(0,0,0,.08)'; for (let x = -24; x < 26; x += 6) c.fillRect(x, 0, 2, 40); c.fillStyle = '#2a2a3a'; c.fillRect(-30, 30, 60, 10); c.restore(); } },
      { path: c => { c.beginPath(); c.moveTo(-20, -34); c.quadraticCurveTo(-40, -10, -34, 22); c.quadraticCurveTo(-26, 30, -18, 20); c.lineTo(18, 20); c.quadraticCurveTo(26, 30, 34, 22); c.quadraticCurveTo(40, -10, 20, -34); c.closePath(); }, fill: '#f4f6fa' },   // 白長髮
      { path: c => aCirc(c, 0, -20, 24), fill: bossBall(c, 0, -20, 24, '#ff8a6a', '#d8382a', '#8e1c16') },
    ], 2.2);
    for (let i = -2; i <= 2; i++) bonten(c, i * 9, 6 + Math.abs(i) * 1.5, 3.6, '#ffffff');
    c.strokeStyle = INK; c.lineWidth = 1; for (let i = 0; i < 12; i++) { const a = .3 + i * .22; aCirc(c, Math.cos(a) * 22, -4 + Math.sin(a) * 20, 2.4); c.fillStyle = '#5a2a14'; c.fill(); c.stroke(); }   // 念珠
    tokin(c, 0, -40, 1.6);
    c.fillStyle = '#ffffff'; for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(sd * 3, -26); c.quadraticCurveTo(sd * 12, -36, sd * 22, -28); c.lineTo(sd * 20, -24); c.quadraticCurveTo(sd * 12, -30, sd * 4, -22); c.closePath(); c.fill(); aInk(c, 1.2); }   // 白眉
    for (const sd of [-1, 1]) bossEye(c, sd * 9, -21, 4.6, 4.2, '#d89a10', '#ffe85a', { slit: 1, lid: .3, lidCol: '#d8382a' });
    c.beginPath(); c.moveTo(-4, -16); c.quadraticCurveTo(14, -24, 34, -34); c.quadraticCurveTo(22, -16, -3, -8); c.closePath(); aFI(c, '#e8463a', 1.8);   // 長鼻
    c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.moveTo(0, -15); c.quadraticCurveTo(14, -21, 28, -30); c.lineTo(28, -28); c.quadraticCurveTo(14, -18, 0, -13); c.fill();
    c.beginPath(); c.moveTo(-14, -8); c.quadraticCurveTo(-12, 14, 0, 22); c.quadraticCurveTo(12, 14, 14, -8); c.quadraticCurveTo(0, -2, -14, -8); aFI(c, '#ffffff', 1.4);   // 白鬚
    c.strokeStyle = '#c8ccd4'; c.lineWidth = 1; for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 4, -4); c.quadraticCurveTo(i * 4.5, 8, i * 2, 18); c.stroke(); }
    bossFist(c, -36, 6, 7.5, '#d8382a', '#8e1c16', { rot: -Math.PI / 2 + .3, flip: 1, cuff: '#f2eee2', cuffLine: '#c8c0a8' });
    featherFan(c, 38, -2, 1.25, .35, '#ffffff', '#e8eef4');
    bossFist(c, 38, 6, 7.5, '#d8382a', '#8e1c16', { rot: Math.PI / 2 - .3, cuff: '#f2eee2', cuffLine: '#c8c0a8' });
  }],
  ['② 白鴉大天狗', '白羽烏鴉頭＋金色鉤喙、朱紅半面具與發紅光的眼、金頭冠；紫袍金護頸，孔雀眼羽扇與金錫杖，白色金邊雙翼', (c, t) => {
    const fl = Math.sin(t * 4);
    c.save(); c.translate(0, -6); wing(c, -1, 64, 54, 8, '#f4f6fa', '#c8a85a', fl * .4); wing(c, 1, 64, 54, 8, '#f4f6fa', '#c8a85a', fl * .4); c.restore();
    staff(c, -32, 44, -42, -38);
    claw(c, -11, 42, 1.8, '#e8b84a'); claw(c, 11, 42, 1.8, '#e8b84a');
    heroSilhouette(c, [
      { path: c => { c.beginPath(); c.moveTo(-24, 0); c.quadraticCurveTo(-30, 24, -18, 38); c.lineTo(18, 38); c.quadraticCurveTo(30, 24, 24, 0); c.closePath(); }, fill: '#5a2a8a',
